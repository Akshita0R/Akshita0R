<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Akshita R, Data Analyst moving into Associate Product Manager">
  <style>
    .t { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #f7f8ff; }
    .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #f7f8ff; }
    .soft { opacity: .72; }
    .faint { opacity: .45; }
    .train { animation: ride 6s cubic-bezier(.65, 0, .35, 1) infinite; }
    @keyframes ride { 0%, 12% { transform: translateX(0); } 45%, 57% { transform: translateX(310px); } 90%, 100% { transform: translateX(620px); } }
    .pulse { transform-origin: 1090px 272px; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .train, .pulse, .blink { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity=".06" /></pattern>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#2350dc" />
  <rect width="1200" height="340" rx="18" fill="url(#grid)" />

  <text class="m faint" x="60" y="62" font-size="14" letter-spacing="3">BENGALURU · INDIA</text>
  <text class="t" x="58" y="128" font-size="64" font-weight="700" letter-spacing="-1.5">Akshita R</text>
  <text class="t" x="60" y="170" font-size="24" font-weight="600">Data Analyst <tspan class="soft">→</tspan> Associate Product Manager</text>
  <text class="m soft" x="60" y="204" font-size="15">product metrics · funnel analysis · AI evaluation<tspan class="blink"> _</tspan></text>

  <!-- career metro line -->
  <path d="M 470 272 H 1090" stroke="#f7f8ff" stroke-opacity=".35" stroke-width="3" />
  <path d="M 470 272 H 780" stroke="#f7f8ff" stroke-width="3" />
  <g class="m" font-size="13">
    <circle cx="470" cy="272" r="9" fill="#f7f8ff" />
    <text x="470" y="306" text-anchor="middle" class="soft">Backend Eng · Volopay</text>
    <circle cx="780" cy="272" r="9" fill="#f7f8ff" />
    <text x="780" y="306" text-anchor="middle" class="soft">Data Analyst · CSG</text>
    <circle class="pulse" cx="1090" cy="272" r="9" fill="#f7f8ff" />
    <circle cx="1090" cy="272" r="9" fill="#2350dc" stroke="#f7f8ff" stroke-width="3" />
    <text x="1090" y="306" text-anchor="end" font-weight="700">NEXT: Associate PM</text>
  </g>
  <g class="train">
    <g transform="translate(446 250)" fill="none" stroke="#f7f8ff" stroke-width="2">
      <rect x="0" y="0" width="48" height="16" rx="5" fill="#2350dc" />
      <path d="M 6 6 h 8 M 18 6 h 8 M 30 6 h 8" />
    </g>
  </g>

  <!-- hockey stick + ball, small signature -->
  <g transform="translate(1080 44)" fill="none" stroke="#f7f8ff" stroke-width="2.4" stroke-linecap="round" opacity=".55">
    <path d="M 10 0 L 46 56 q 5 8 15 6 l 8 -2" /><circle cx="34" cy="72" r="5" fill="#f7f8ff" />
  </g>
  <text class="m faint" x="60" y="232" font-size="12.5">MedNear 0→1 · patent filed · state-level hockey</text>
</svg>
